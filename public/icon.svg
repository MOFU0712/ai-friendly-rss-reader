<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#3b82f6"/>
  <g fill="white">
    <!-- Newspaper body -->
    <rect x="96" y="96" width="320" height="320" rx="16" fill="white"/>
    <!-- Header bar -->
    <rect x="120" y="120" width="272" height="40" rx="4" fill="#3b82f6"/>
    <!-- Article lines -->
    <rect x="120" y="184" width="180" height="12" rx="2" fill="#cbd5e1"/>
    <rect x="120" y="208" width="160" height="12" rx="2" fill="#cbd5e1"/>
    <rect x="120" y="232" width="200" height="12" rx="2" fill="#cbd5e1"/>
    <!-- Image placeholder -->
    <rect x="120" y="268" width="120" height="80" rx="4" fill="#e2e8f0"/>
    <!-- More text lines -->
    <rect x="260" y="268" width="132" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="260" y="288" width="120" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="260" y="308" width="132" height="10" rx="2" fill="#cbd5e1"/>
    <rect x="260" y="328" width="100" height="10" rx="2" fill="#cbd5e1"/>
    <!-- Bottom section -->
    <rect x="120" y="368" width="272" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="120" y="386" width="200" height="8" rx="2" fill="#e2e8f0"/>
  </g>
</svg>
